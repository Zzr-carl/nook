<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 A · 图标条</title>
<style>
  :root{
    --ink:#F4F5F7; --ink-soft:rgba(244,245,247,.62); --ink-faint:rgba(244,245,247,.34);
    --accent:#E9B872; --rail:#0E1013; --rail-2:#15171C;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Consolas,monospace;
    --sans:"Sora","Inter",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:#2A2620; overflow:hidden;
    background:
      radial-gradient(120% 80% at 78% 12%, #FBF7EE 0%, #F3EBDD 42%, #E8DDC9 100%);
  }
  /* 壁纸质感 */
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(46% 34% at 22% 74%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(38% 30% at 86% 62%, rgba(214,196,166,.42), transparent 72%);
    filter:blur(.4px);
  }
  .stage{position:relative; height:100vh; display:flex; flex-direction:column; align-items:center}

  /* ============ 轨道 ============ */
  .rail{
    position:relative; display:flex; align-items:flex-start;
    height:34px; padding:0 14px; gap:2px;
    background:linear-gradient(180deg,var(--rail),var(--rail-2));
    border-radius:0 0 12px 12px;
    box-shadow:0 1px 0 rgba(0,0,0,.18), 0 6px 18px -8px rgba(20,16,8,.35);
  }
  .rail::after{
    content:""; position:absolute; inset:0; border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06); pointer-events:none;
  }
  .slot{
    position:relative; width:40px; height:34px; display:grid; place-items:center;
    cursor:default;
  }
  .slot svg{width:20px;height:20px;display:block;transition:transform .18s cubic-bezier(.2,.9,.2,1), filter .18s}
  .slot .mark{position:absolute; bottom:0; left:50%; transform:translateX(-50%) scaleX(0);
    width:16px;height:2px;border-radius:2px;background:var(--accent);transition:transform .2s}
  .slot:hover svg{transform:scale(1.18);filter:brightness(1.15)}
  .slot:hover .mark{transform:translateX(-50%) scaleX(1)}

  /* ============ 预览卡 ============ */
  .hint{
    position:absolute; top:38px; left:0; transform:translateX(-50%);
    display:flex; align-items:center; gap:10px;
    padding:9px 13px; border-radius:13px;
    background:rgba(14,16,19,.96);
    box-shadow:0 10px 30px -12px rgba(20,16,8,.6), inset 0 0 0 1px rgba(255,255,255,.12);
    opacity:0; transition:opacity .16s ease, top .16s ease;
    pointer-events:none; white-space:nowrap;
  }
  .hint.on{opacity:1; top:44px}
  .hint b{font-size:12.5px;font-weight:500;color:var(--ink)}
  .hint span{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}
  .hint .row{display:flex;gap:6px;margin-left:2px}
  .hint .row svg{width:17px;height:17px}

  /* ============ 说明 ============ */
  .note{
    position:fixed; left:40px; bottom:36px; max-width:430px;
  }
  .tag{
    display:inline-block; font-family:var(--mono); font-size:10.5px; letter-spacing:.12em;
    color:#8A6B36; background:rgba(233,184,114,.24); padding:3px 8px; border-radius:5px;
  }
  .note h1{font-size:26px; font-weight:600; letter-spacing:-.01em; margin:14px 0 10px; color:#241F18}
  .note p{font-size:13.5px; line-height:1.72; color:#5C5344}
  .note p + p{margin-top:7px}
  .note em{font-style:normal;color:#8A6B36;border-bottom:1px solid rgba(138,107,54,.35)}
  .dim{position:fixed;right:40px;bottom:36px;font-family:var(--mono);font-size:10.5px;color:#9A8E78;text-align:right;line-height:1.9}

  /* 尊重系统"减少动态效果"设置 */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="stage">

  <div class="rail" id="rail">
    <!-- 游戏 -->
    <div class="slot" data-name="游戏" data-count="23">
      <svg viewBox="0 0 24 24" fill="none" stroke="#E9B872" stroke-width="1.7">
        <circle cx="12" cy="12" r="7.2"/><path d="M12 3.4v3M12 17.6v3M3.4 12h3M17.6 12h3"/><circle cx="12" cy="12" r="1.6" fill="#E9B872" stroke="none"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 驱动优化 -->
    <div class="slot" data-name="驱动优化" data-count="11">
      <svg viewBox="0 0 24 24" fill="none" stroke="#8FA6B8" stroke-width="1.7">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M12 2.8v2.6M12 18.6v2.6M4.6 12H2M22 12h-2.6M6.2 6.2 4.4 4.4M19.6 19.6l-1.8-1.8M17.8 6.2l1.8-1.8M4.4 19.6l1.8-1.8"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 加速器 -->
    <div class="slot" data-name="加速器" data-count="3">
      <svg viewBox="0 0 24 24" fill="none" stroke="#B7C99B" stroke-width="1.7">
        <path d="M13.6 2.8 5 13.4h5.2L10.4 21.2 19 10.6h-5.2z" stroke-linejoin="round"/>
      </svg><i class="mark"></i>
    </div>
    <!-- AI -->
    <div class="slot" data-name="AI" data-count="15">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C9A6A0" stroke-width="1.7">
        <rect x="4.4" y="4.4" width="15.2" height="15.2" rx="4.4"/>
        <path d="M9.2 9.4v5.2M14.8 9.4v5.2"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 文件夹 -->
    <div class="slot" data-name="文件夹" data-count="9">
      <svg viewBox="0 0 24 24" fill="none" stroke="#D8C08A" stroke-width="1.7">
        <path d="M3.2 7.6a1.8 1.8 0 0 1 1.8-1.8h4l2 2.4h7.2a1.8 1.8 0 0 1 1.8 1.8v7.4a1.8 1.8 0 0 1-1.8 1.8H5a1.8 1.8 0 0 1-1.8-1.8z" stroke-linejoin="round"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 媒体 -->
    <div class="slot" data-name="媒体" data-count="8">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9FB98F" stroke-width="1.7">
        <path d="M8.6 6.4 18 12l-9.4 5.6z" stroke-linejoin="round"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 工具 -->
    <div class="slot" data-name="工具" data-count="10">
      <svg viewBox="0 0 24 24" fill="none" stroke="#A9A9AE" stroke-width="1.7">
        <path d="M14.2 4.2a4.2 4.2 0 0 0 5.4 5.4l-9.2 9.2a2.4 2.4 0 1 1-3.4-3.4z" stroke-linejoin="round"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 社交 -->
    <div class="slot" data-name="社交" data-count="6">
      <svg viewBox="0 0 24 24" fill="none" stroke="#C6A08B" stroke-width="1.7">
        <path d="M4.4 9.2a3 3 0 0 1 3-3h9.2a3 3 0 0 1 3 3v3.6a3 3 0 0 1-3 3H10l-3.6 3v-3a2 2 0 0 1-2-2z" stroke-linejoin="round"/>
      </svg><i class="mark"></i>
    </div>
    <!-- 杂七杂八 -->
    <div class="slot" data-name="杂七杂八" data-count="4">
      <svg viewBox="0 0 24 24" fill="none" stroke="#9AA7A0" stroke-width="1.7">
        <rect x="4.2" y="4.2" width="6.2" height="6.2" rx="1.6"/>
        <rect x="13.6" y="4.2" width="6.2" height="6.2" rx="1.6"/>
        <rect x="4.2" y="13.6" width="6.2" height="6.2" rx="1.6"/>
        <rect x="13.6" y="13.6" width="6.2" height="6.2" rx="1.6"/>
      </svg><i class="mark"></i>
    </div>

    <div class="hint" id="hint">
      <b id="hn">游戏</b><span id="hc">23 项</span>
      <div class="row" id="hr"></div>
    </div>
  </div>

</div>

<div class="note">
  <span class="tag">方案 A</span>
  <h1>图标条</h1>
  <p>每一格直接显示抽屉里第一个程序的图标，不用悬停就能认出是哪个抽屉。</p>
  <p>代价：轨道从「一排安静的刻度」变成「一条图标栏」，视觉重心明显变重。<em>你之前定的克制风格会在这里被打破。</em></p>
</div>

<div class="dim">每格 40 × 34 · 图标 20px<br>轨道总宽 400</div>

<script>
const rail = document.getElementById('rail');
const hint = document.getElementById('hint');
const slots = [...document.querySelectorAll('.slot')];

slots.forEach((s, i) => {
  s.addEventListener('mouseenter', () => {
    document.getElementById('hn').textContent = s.dataset.name;
    document.getElementById('hc').textContent = s.dataset.count + ' 项';

    // 预览卡里复用它自己的图标
    const row = document.getElementById('hr');
    row.innerHTML = '';
    slots.slice(0, 6).forEach(o => {
      const c = o.querySelector('svg').cloneNode(true);
      c.style.opacity = .7;
      row.appendChild(c);
    });

    const r = s.getBoundingClientRect();
    hint.style.left = (r.left + r.width / 2) + 'px';
    hint.classList.add('on');
  });
});
rail.addEventListener('mouseleave', () => hint.classList.remove('on'));
</script>
</body>
</html>
