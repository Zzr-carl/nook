<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方案 C · 大刻度</title>
<style>
  :root{
    --ink:#F4F5F7; --ink-faint:rgba(244,245,247,.34);
    --accent:#E9B872; --rail:#0E1013; --rail-2:#15171C;
    --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
    --sans:"Sora","Inter",-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);overflow:hidden;
    background:radial-gradient(120% 80% at 78% 12%, #FBF7EE 0%, #F3EBDD 42%, #E8DDC9 100%);
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(46% 34% at 22% 74%, rgba(255,255,255,.55), transparent 70%),
      radial-gradient(38% 30% at 86% 62%, rgba(214,196,166,.42), transparent 72%);
  }
  .stage{position:relative;height:100vh;display:flex;justify-content:center}

  .rail{
    position:relative;display:flex;align-items:flex-start;height:22px;padding:0 16px;
    background:linear-gradient(180deg,var(--rail),var(--rail-2));
    border-radius:0 0 12px 12px;
    box-shadow:0 6px 20px -10px rgba(20,16,8,.42);
  }
  .rail::after{content:"";position:absolute;inset:0;border-radius:inherit;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);pointer-events:none}

  /* 每格 32 宽、22 高，目标明显更大 */
  .slot{position:relative;width:32px;height:22px;display:grid;place-items:start center;cursor:default}
  .tick{width:5px;height:13px;border-radius:0 0 2px 2px;
    background:rgba(244,245,247,.24);transition:height .18s, background .18s, box-shadow .18s}
  .slot:hover .tick{height:22px;background:var(--accent);box-shadow:0 0 12px rgba(233,184,114,.55)}

  .hint{
    position:absolute;top:30px;left:0;transform:translateX(-50%);
    display:flex;align-items:center;gap:10px;padding:9px 13px;border-radius:13px;
    background:rgba(14,16,19,.96);white-space:nowrap;
    box-shadow:0 10px 30px -12px rgba(20,16,8,.6),inset 0 0 0 1px rgba(255,255,255,.12);
    opacity:0;transition:opacity .16s ease, top .16s ease;pointer-events:none;
  }
  .hint.on{opacity:1;top:36px}
  .hint b{font-size:12.5px;font-weight:500;color:var(--ink)}
  .hint span{font-family:var(--mono);font-size:10px;color:var(--ink-faint)}

  .note{position:fixed;left:40px;bottom:36px;max-width:440px}
  .tag{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
    color:#8A6B36;background:rgba(233,184,114,.24);padding:3px 8px;border-radius:5px}
  .note h1{font-size:26px;font-weight:600;letter-spacing:-.01em;margin:14px 0 10px;color:#241F18}
  .note p{font-size:13.5px;line-height:1.72;color:#5C5344}
  .note p+p{margin-top:7px}
  .note em{font-style:normal;color:#8A6B36;border-bottom:1px solid rgba(138,107,54,.35)}
  .dim{position:fixed;right:40px;bottom:36px;font-family:var(--mono);font-size:10.5px;color:#9A8E78;text-align:right;line-height:1.9}

  /* 尊重系统"减少动态效果"设置 */
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="rail" id="rail">
    <div class="slot" data-name="游戏" data-count="23"><div class="tick"></div></div>
    <div class="slot" data-name="驱动优化" data-count="11"><div class="tick"></div></div>
    <div class="slot" data-name="加速器" data-count="3"><div class="tick"></div></div>
    <div class="slot" data-name="AI" data-count="15"><div class="tick"></div></div>
    <div class="slot" data-name="文件夹" data-count="9"><div class="tick"></div></div>
    <div class="slot" data-name="媒体" data-count="8"><div class="tick"></div></div>
    <div class="slot" data-name="工具" data-count="10"><div class="tick"></div></div>
    <div class="slot" data-name="社交" data-count="6"><div class="tick"></div></div>
    <div class="slot" data-name="杂七杂八" data-count="4"><div class="tick"></div></div>

    <div class="hint" id="hint"><b id="hn">游戏</b><span id="hc">23 项</span></div>
  </div>
</div>

<div class="note">
  <span class="tag">方案 C</span>
  <h1>大刻度</h1>
  <p>只放大、不改模型：每格 32×22（现在是 26×18），刻度线 5px 粗、悬停长到 22px 并带一圈微光。</p>
  <p>代价：轨道变宽到 320 像素，安静感会减弱一点。<em>但交互方式一秒都不用重学。</em></p>
</div>

<div class="dim">
  当前 26 × 18 · 刻度 4px<br>
  本方案 32 × 22 · 刻度 5px
</div>

<script>
const rail = document.getElementById('rail');
const hint = document.getElementById('hint');

document.querySelectorAll('.slot').forEach(s => {
  s.addEventListener('mouseenter', () => {
    document.getElementById('hn').textContent = s.dataset.name;
    document.getElementById('hc').textContent = s.dataset.count + ' 项';
    const r = s.getBoundingClientRect();
    hint.style.left = (r.left + r.width / 2) + 'px';
    hint.classList.add('on');
  });
});
rail.addEventListener('mouseleave', () => hint.classList.remove('on'));
</script>
</body>
</html>
